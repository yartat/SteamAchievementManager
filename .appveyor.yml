version: 7.0.{build}

branches:
  only:
    - master

skip_tags: true
skip_commits:
  files:
    - .github/*
    - README.md
    - CLAUDE.md

max_jobs: 1

image: Visual Studio 2022

clone_folder: c:\projects\SAM

cache:
  - '%LocalAppData%\NuGet\Cache'
  - '%LocalAppData%\NuGet\v3-cache'

# The VS2022 image does not ship the .NET 10 SDK yet; install the version
# pinned by global.json before restoring.
install:
  - ps: |
      $global = Get-Content global.json | ConvertFrom-Json
      $version = $global.sdk.version
      Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile dotnet-install.ps1
      ./dotnet-install.ps1 -Version $version -InstallDir "$env:ProgramFiles\dotnet"
      dotnet --info

configuration:
  - Release

dotnet_csproj:
  patch: true
  file: '**\*.csproj'
  version: '{version}'
  assembly_version: '{version}'
  file_version: '{version}'
  informational_version: '{version}'

build_script:
  - dotnet build SAM.sln -c Release -v minimal

# One framework-dependent bundle per target. Both executables publish into the
# same folder because they launch each other by path. Only the x86/x64 targets
# can actually load Steam's client library -- the arm64 bundles are published
# for completeness and report an explanatory error on launch. See README.md.
after_build:
  - ps: |
      $ErrorActionPreference = 'Stop'
      $env:TZ = 'GMT'
      git log . > git-log.txt
      $rids = 'win-x64','win-x86','win-arm64','linux-x64','linux-arm64','osx-x64','osx-arm64'
      foreach ($rid in $rids) {
        $out = "publish\$rid"
        dotnet publish SAM.Picker\SAM.Picker.csproj -c Release -r $rid --self-contained false -o $out -v minimal
        dotnet publish SAM.Game\SAM.Game.csproj   -c Release -r $rid --self-contained false -o $out -v minimal
        Copy-Item LICENSE.txt, git-log.txt $out
        7z a -r -tzip -mx=9 -x!*.pdb "SteamAchievementManager-$env:APPVEYOR_BUILD_VERSION-$rid.zip" ".\$out\*"
      }

artifacts:
  - path: '*-*.zip'

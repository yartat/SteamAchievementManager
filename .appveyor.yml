version: 7.0.{build}

branches:
  only:
    - master

skip_tags: true
skip_commits:
  files:
    - .github/*
    - README.md
    - CLAUDE.md

max_jobs: 1

image: Visual Studio 2022

clone_folder: c:\projects\SAM

cache:
  - '%LocalAppData%\NuGet\Cache'
  - '%LocalAppData%\NuGet\v3-cache'

# The VS2022 image does not ship the .NET 10 SDK yet; install the version
# pinned by global.json before restoring.
install:
  - ps: |
      $global = Get-Content global.json | ConvertFrom-Json
      $version = $global.sdk.version
      Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile dotnet-install.ps1
      ./dotnet-install.ps1 -Version $version -InstallDir "$env:ProgramFiles\dotnet"
      dotnet --info

configuration:
  - Release

dotnet_csproj:
  patch: true
  file: '**\*.csproj'
  version: '{version}'
  assembly_version: '{version}'
  file_version: '{version}'
  informational_version: '{version}'

build_script:
  - dotnet build SAM.sln -c Release -v minimal

# Framework-dependent output: the .exe will not start without the matching
# .NET Desktop Runtime. The whole bin directory is shipped because Avalonia
# needs its own assemblies plus the native Skia/HarfBuzz libraries under
# runtimes/ -- packaging only the executables produces a build that cannot
# start. To produce a build that runs without a preinstalled runtime, see the
# self-contained publish command in README.md.
after_build:
  - set TZ=GMT
  - git log . > git-log.txt
  - 7z a -r -tzip -mx=9 -x!*/LICENSE.txt -x!*.pdb SteamAchievementManager-%APPVEYOR_BUILD_VERSION%.zip ./LICENSE.txt ./git-log.txt ./bin/

artifacts:
  - path: '*-*.zip'
